<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#071216">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container" aria-label="{{{ PRODUCT_NAME }}} digital twin">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <section id="unity-loading" aria-live="polite">
        <div class="loading-panel">
          <div class="loading-kicker">DIGITAL TWIN</div>
          <div class="loading-title">INITIALISING SYSTEM</div>
          <div class="loading-track"><div id="unity-progress"></div></div>
          <div id="unity-progress-label">0%</div>
        </div>
      </section>
      <div id="unity-warning" role="status"></div>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const progress = document.querySelector("#unity-progress");
      const progressLabel = document.querySelector("#unity-progress-label");
      const warning = document.querySelector("#unity-warning");

      // The canvas covers the whole screen, under the notch, the home
      // indicator and the browser's toolbars, so the scene never shows a band
      // of page colour. Unity keeps its controls inside the insets measured
      // here (see DeviceSafeArea).
      //
      // Safari and Firefox on iOS shrink and grow their bottom toolbar while
      // the page is used. On a phone the canvas therefore keeps the tallest
      // height the browser shows, and the bottom inset is the toolbar's full
      // height, so neither the canvas nor the controls above the toolbar move
      // when it changes. Turning the phone measures afresh. On a desktop the
      // canvas simply follows the window.
      //
      // The toolbar's height is the tallest view less the shortest one the
      // browser has actually shown. Not 100svh: Safari's floating toolbar
      // covers less than the space svh reserves, which left a band of
      // nothing above it.
      const container = document.querySelector("#unity-container");
      const isMobile =
        /android|iphone|ipad|ipod|mobile|silk|kindle/i.test(navigator.userAgent || "") ||
        (window.matchMedia && window.matchMedia("(pointer: coarse)").matches && (navigator.maxTouchPoints || 0) > 0);

      function createProbe(className) {
        const probe = document.createElement("div");
        probe.className = "viewport-probe " + className;
        probe.setAttribute("aria-hidden", "true");
        document.body.appendChild(probe);
        return probe;
      }

      const largeProbe = createProbe("viewport-probe-large");
      const safeProbe = createProbe("viewport-probe-safe");

      const viewportState = { width: -1, tallest: 0, shortest: Infinity };
      window.DigitalTwinViewport = { insets: { top: 0, right: 0, bottom: 0, left: 0 }, height: 0 };

      function measureViewport(fresh) {
        const width = window.innerWidth;
        const shown = window.innerHeight;
        const large = largeProbe.getBoundingClientRect().height || shown;
        if (fresh || !isMobile || width !== viewportState.width) {
          viewportState.width = width;
          viewportState.tallest = 0;
          viewportState.shortest = Infinity;
        }
        viewportState.tallest = Math.max(viewportState.tallest, large, shown);
        viewportState.shortest = Math.min(viewportState.shortest, shown);

        const safe = getComputedStyle(safeProbe);
        const edge = name => parseFloat(safe[name]) || 0;
        const height = Math.max(1, Math.round(viewportState.tallest));
        const toolbar = Math.max(0, viewportState.tallest - viewportState.shortest);

        const viewport = window.DigitalTwinViewport;
        viewport.height = height;
        viewport.insets.top = edge("paddingTop");
        viewport.insets.right = edge("paddingRight");
        viewport.insets.bottom = Math.max(edge("paddingBottom"), toolbar);
        viewport.insets.left = edge("paddingLeft");
        document.documentElement.style.setProperty("--digital-twin-height", height + "px");
        container.scrollTop = 0;
      }

      let viewportFrame = 0;
      function requestViewportMeasure() {
        if (viewportFrame) cancelAnimationFrame(viewportFrame);
        viewportFrame = requestAnimationFrame(() => {
          viewportFrame = 0;
          measureViewport(false);
        });
      }

      function handleOrientationChange() {
        requestViewportMeasure();
        // Mobile Safari can report the previous viewport for a short time
        // after rotation: measure again once it has settled, from scratch.
        setTimeout(requestViewportMeasure, 100);
        setTimeout(() => measureViewport(true), 400);
      }

      measureViewport(true);
      window.addEventListener("resize", requestViewportMeasure, { passive: true });
      window.addEventListener("orientationchange", handleOrientationChange, { passive: true });
      if (window.visualViewport)
        window.visualViewport.addEventListener("resize", requestViewportMeasure, { passive: true });
      // A page that scrolled would move the canvas with it.
      window.addEventListener("scroll", () => window.scrollTo(0, 0), { passive: true });

      function showBanner(message, type) {
        const item = document.createElement("div");
        item.className = "banner " + (type || "info");
        item.textContent = message;
        warning.appendChild(item);
        if (type !== "error") setTimeout(() => item.remove(), 5000);
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        autoSyncPersistentDataPath: true,
        showBanner
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, value => {
          const percent = Math.round(value * 100);
          progress.style.width = percent + "%";
          progressLabel.textContent = percent + "%";
        }).then(instance => {
          window.unityInstance = instance;
          loading.classList.add("loaded");
          setTimeout(() => loading.remove(), 350);
        }).catch(message => {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
